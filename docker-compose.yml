services:
  db:
    image: yarins2000/petshopdb:1.0
    restart: always
  app:
    depends_on:
      - db
    build: .
    image: yarins2000/petshopapp:2.0
    ports:
      - "3000:8080"
    environment:
      # Demo credentials for the bundled petshopdb image. Override the whole
      # connection string (e.g. in docker-compose.override.yml) to point at another server.
      - "ConnectionStrings__DefaultConnection=Server=tcp:db,1433;Initial Catalog=PetShop;Persist Security Info=False;User ID=sa;Password=Qwe12345!;MultipleActiveResultSets=False;Encrypt=True;TrustServerCertificate=True;Connection Timeout=30;"
    restart: always
